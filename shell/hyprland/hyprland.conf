# ═════════════════════════════════════════════════════════
#  NimehOS — Hyprland 0.55 Config (نسخه فیکس‌شده v4)
#  FIX v4: رفع کلیدهای خراب (code:133 → super_l) +
#          افزودن Win+S/V/Period/Shift+S + هماهنگی IPC
# ═════════════════════════════════════════════════════════

# ---------- اجرای خودکار ----------
exec-once = env QT_QUICK_BACKEND=software quickshell -p $HOME/NimehOS/shell
exec-once = /usr/libexec/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --wayland --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start pipewire pipewire-pulse wireplumber
exec-once = wl-paste --watch cliphist store
exec-once = $HOME/NimehOS/bin/float-daemon

# ---------- مانیتور ----------
monitor = , preferred, auto, 1

# ---------- متغیرهای محیطی ----------
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt6ct
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = MOZ_ENABLE_WAYLAND, 1

# ---------- ورودی ----------
input {
    kb_layout = us, ir
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
    sensitivity = 0
    accel_profile = flat
}

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

# ---------- عمومی ----------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 0
    col.active_border = rgba(0099FFee)
    col.inactive_border = rgba(3A3A3E66)
    layout = dwindle
    resize_on_border = true
}

# ---------- تزئینات ----------
decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000066)
        offset = 0 3
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = true
    }
}

# ---------- انیمیشن‌ها ----------
animations {
    enabled = true
    bezier = winEase, 0.22, 1, 0.36, 1
    bezier = winBack, 0.34, 1.4, 0.64, 1

    animation = windows, 1, 4, winEase, slide
    animation = windowsIn, 1, 4, winBack, slide
    animation = windowsOut, 1, 4, winEase, slide
    animation = windowsMove, 1, 4, winEase, slide
    animation = fade, 1, 4, default
    animation = border, 1, 4, default
    animation = layers, 1, 4, default, fade
    animation = workspaces, 1, 4, winEase, slide
}

# ---------- متفرقه ----------
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(konsole|kitty|alacritty|foot)$
}

gestures {
}

dwindle {
    preserve_split = true
}

# ═══════════════ کلیدها ($super = کلید ویندوز) ═══════════════
$super = SUPER

# --- برنامه‌ها ---
bind = $super, Return, exec, konsole
bind = $super, E, exec, dolphin
bind = $super, I, exec, nimehos-settings-v2
bind = $super, R, exec, quickshell ipc call shell/toggleLauncher
# Win+S: جستجو (همان لانچر با فوکوس روی سرچ)
bind = $super, S, exec, quickshell ipc call shell/toggleLauncher

# --- پنجره ---
bind = $super, Q, killactive
bind = ALT, F4, killactive
bind = $super, M, movetoworkspacesilent, special:minimized
bind = $super, F, fullscreen, 1
bind = $super SHIFT, F, fullscreen, 0
# FIX v4: togglefloating به Super+T منتقل شد تا Win+V برای کلیپ‌بورد آزاد شود
bind = $super, T, togglefloating
bind = $super SHIFT, V, centerwindow
# Win+V: تاریخچه کلیپ‌بورد (cliphist + wofi)
bind = $super, V, exec, sh -c 'cliphist list | wofi --dmenu --prompt "Clipboard" | cliphist decode | wl-copy'
# Win+Period: انتخاب ایموجی
bind = $super, period, exec, sh -c 'command -v wofi-emoji >/dev/null 2>&1 && wofi-emoji || (command -v bemoji >/dev/null 2>&1 && bemoji) || (command -v rofi >/dev/null 2>&1 && rofi -show emoji) || true'

# --- پنل‌های NimehOS (IPC) ---
# FIX v4: کد 133 (کلید Menu) اشتباه بود. کلید Super تنها با `super_l`
# در Hyprland پشتیبانی می‌شود — برای منوی استارت استفاده می‌شود.
bind = $super, super_l, exec, quickshell ipc call shell/toggleStart
bind = $super, A, exec, quickshell ipc call shell/toggleQuick
bind = $super, N, exec, quickshell ipc call shell/toggleNotifications
bind = $super, W, exec, quickshell ipc call shell/toggleWidgets
bind = $super, Tab, exec, quickshell ipc call shell/toggleTaskView
bind = $super, Z, exec, quickshell ipc call shell/toggleSnap
bind = $super, X, exec, quickshell ipc call shell/togglePower
bind = $super, L, exec, loginctl lock-session
bind = $super, D, exec, quickshell ipc call shell/toggleLauncher

# --- تست قفل صفحه (Win+B) ---
bind = $super, B, exec, loginctl lock-session

# --- Alt+Tab ---
bind = ALT, Tab, exec, quickshell ipc call shell/toggleAltTab
bind = ALT SHIFT, Tab, exec, quickshell ipc call shell/toggleAltTab

# --- اسنپ ویندوزی: Win+Arrow ---
bind = $super, Left,  movewindow, l
bind = $super, Right, movewindow, r
bind = $super, Up,    movewindow, u
bind = $super, Down,  movewindow, d

# --- فوکوس (با Ctrl) ---
bind = $super CTRL, Left,  movefocus, l
bind = $super CTRL, Right, movefocus, r
bind = $super CTRL, Up,    movefocus, u
bind = $super CTRL, Down,  movefocus, d

# --- جابه‌جایی پنجره ---
bind = $super SHIFT, Left,  movewindow, l
bind = $super SHIFT, Right, movewindow, r
bind = $super SHIFT, Up,    movewindow, u
bind = $super SHIFT, Down,  movewindow, d

# --- ماوس: Super+درگ = جابه‌جایی آزاد | Super+راست‌درگ = تغییر اندازه ---
bindm = $super, mouse:272, movewindow
bindm = $super, mouse:273, resizewindow

# --- ورک‌اسپیس ---
bind = $super, 1, workspace, 1
bind = $super, 2, workspace, 2
bind = $super, 3, workspace, 3
bind = $super, 4, workspace, 4
bind = $super, 5, workspace, 5
bind = $super SHIFT, 1, movetoworkspacesilent, 1
bind = $super SHIFT, 2, movetoworkspacesilent, 2
bind = $super SHIFT, 3, movetoworkspacesilent, 3
bind = $super CTRL, Tab, workspace, +1
bind = $super CTRL SHIFT, Tab, workspace, -1

# --- اسکرین‌شات ---
bind = , Print, exec, grim /tmp/nimeh-screen.png
bind = SHIFT, Print, exec, sh -c 'grim -g "$(slurp)" /tmp/nimeh-region.png'
# FIX v4: Win+Shift+S برای اسکرین‌شات منطقه‌ای (هماهنگ با ویندوز)
bind = $super SHIFT, S, exec, sh -c 'grim -g "$(slurp)" /tmp/nimeh-region.png && notify-send -t 1500 "NimehOS" "اسکرین‌شات منطقه ذخیره شد"'

# --- صدا و روشنایی ---
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ---------- قوانین پنجره ----------
windowrule = float on, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$
windowrule = size 700 500, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = center on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(wofi)$
windowrule = center on, match:class ^(wofi)$
windowrule = float on, match:class ^(nimehos-settings-v2)$
windowrule = center on, match:class ^(nimehos-settings-v2)$
windowrule = size 900 600, match:class ^(nimehos-settings-v2)$
windowrule = float on, match:class ^(file-roller)$
windowrule = float on, match:class ^(galculator)$
windowrule = float on, match:class ^(org.kde.kcalc)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save File)$
windowrule = float on, match:title ^(Open Folder)$

# ---------- قوانین لایه (بلور) ----------
# FIX: blur از contextmenu حذف شد — باعث بلر شدن کل پس‌زمینه می‌شد
layerrule = blur on, match:namespace nimeh-taskbar
layerrule = blur on, match:namespace nimeh-startmenu
layerrule = blur on, match:namespace nimeh-quicksettings
layerrule = blur on, match:namespace nimeh-notifications
layerrule = blur on, match:namespace nimeh-widgets
layerrule = blur on, match:namespace nimeh-powermenu
layerrule = blur on, match:namespace nimeh-lockscreen
layerrule = blur on, match:namespace nimeh-applauncher
layerrule = blur on, match:namespace nimeh-snap
layerrule = blur on, match:namespace nimeh-alttab
layerrule = blur on, match:namespace nimeh-taskview
layerrule = blur on, match:namespace nimeh-windowtitle

# ---------- permission ----------
permission = /usr/(bin|local/bin)/grim, screencopy, allow
permission = /usr/(bin|local/bin)/slurp, screencopy, allow
permission = /usr/(bin|local/bin)/wl-copy, screencopy, allow

